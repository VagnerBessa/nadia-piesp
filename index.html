<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nadia AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&display=swap" />
  <script type="importmap">
{
  "imports": {
    "@heroicons/react/": "https://aistudiocdn.com/@heroicons/react@^2.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "firebase-functions/": "https://aistudiocdn.com/firebase-functions@^7.0.0/",
    "cors": "https://aistudiocdn.com/cors@^2.8.5",
    "@mui/material/": "https://aistudiocdn.com/@mui/material@^5.15.0/",
    "@mui/material": "https://aistudiocdn.com/@mui/material@^5.15.0",
    "@emotion/react": "https://aistudiocdn.com/@emotion/react@^11.11.0",
    "@emotion/styled": "https://aistudiocdn.com/@emotion/styled@^11.11.0",
    "recharts": "https://aistudiocdn.com/recharts@^2.12.0"
  }
}
</script>
<style>
  body {
    background-color: #042a3a;
    background-image: radial-gradient(at 50% 0%, rgba(28, 106, 133, 0.4) 0%, transparent 50%);
    background-repeat: no-repeat;
    background-size: 100vw 100vh;
    background-attachment: fixed;
  }
  /* ── CapivaraPet keyframes ── */
  @keyframes capivara-breathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50%       { transform: scaleY(0.975) translateY(1px); }
  }
  @keyframes capivara-tilt {
    0%, 68%, 100% { transform: rotate(0deg); }
    74%           { transform: rotate(4deg); }
    83%           { transform: rotate(-2deg); }
    93%           { transform: rotate(1deg); }
  }
  @keyframes capivara-blink {
    0%, 92%, 100% { opacity: 0; }
    94%, 96%      { opacity: 1; }
  }
  @keyframes capivara-blink-slow {
    0%, 95%, 100% { opacity: 0; }
    97%, 99%      { opacity: 1; }
  }
  @keyframes capivara-look-up {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  @keyframes capivara-eye-dart {
    0%, 65%, 100% { transform: translateX(0); }
    70%           { transform: translateX(5px); }
    78%           { transform: translateX(-4px); }
    89%           { transform: translateX(0); }
  }
  /* olhar para a esfera — landing page (posição padrão = esfera; olhada rápida para frente) */
  @keyframes capivara-eye-sphere {
    0%, 70%, 100% { transform: translate(-3px, -4px); }
    76%           { transform: translate(0px, 0px); }
    87%           { transform: translate(0px, 0px); }
    93%           { transform: translate(-3px, -4px); }
  }
  @keyframes capivara-paw-left {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-18px); }
  }
  @keyframes capivara-paw-right {
    0%, 100% { transform: translateY(-18px); }
    50%      { transform: translateY(0); }
  }
  /* varredura de dados — analyzing */
  @keyframes capivara-analyze-paw {
    0%, 100%  { transform: translate(0px,   -2px); }
    25%       { transform: translate(28px, -10px); }
    48%       { transform: translate(54px,  -4px); }
    68%       { transform: translate(38px, -12px); }
    85%       { transform: translate(14px,  -6px); }
  }
  /* patrulha lateral — supervising */
  @keyframes capivara-patrol {
    0%, 100% { transform: translateX(0px); }
    50%      { transform: translateX(200px); }
  }
  /* travessia da tela — landing page */
  @keyframes capivara-walk-lr {
    0%   { transform: translateX(-80px); }
    100% { transform: translateX(calc(100vw + 10px)); }
  }
  /* varredura ocular — supervising */
  @keyframes capivara-eye-scan {
    0%   { transform: translateX(-6px); }
    50%  { transform: translateX(6px); }
    100% { transform: translateX(-6px); }
  }
  /* leitura suave — reading */
  @keyframes capivara-eye-read {
    0%, 100% { transform: translateX(-4px); }
    60%      { transform: translateX(4px); }
  }
  /* olhar orgulhoso — olha para o texto, depois para o usuário */
  @keyframes capivara-eye-proud {
    0%, 38%  { transform: translateX(-5px); }
    52%, 82% { transform: translateX(0px);  }
    94%, 100%{ transform: translateX(-5px); }
  }
  /* gráficos flutuantes — tela de loading do Explorar */
  /* olhar pausado para os campos — sidebar do Explorar */
  /* observar grafo abaixo — olha para baixo varrendo o resultado */
  @keyframes capivara-eye-observe {
    0%, 20%, 100% { transform: translate(0px,  3px); }
    30%, 50%      { transform: translate(-4px, 3px); }
    60%, 80%      { transform: translate(4px,  3px); }
  }
  @keyframes capivara-eye-fields {
    0%, 50%, 100% { transform: translate(0px, 0px); }
    60%, 80%      { transform: translate(0px, -4px); }
  }
  /* olhar fixo para baixo — grafo gerado */
  @keyframes capivara-eye-graph {
    0%, 100% { transform: translateY(4px); }
  }
  @keyframes pet-float-a {
    0%, 100% { transform: translateY(0px);   opacity: 0.85; }
    50%      { transform: translateY(-14px); opacity: 1;    }
  }
  @keyframes pet-float-b {
    0%, 100% { transform: translateY(-10px); opacity: 0.8; }
    50%      { transform: translateY(6px);   opacity: 1;   }
  }
  @keyframes pet-float-c {
    0%, 100% { transform: translateY(-5px);  opacity: 0.75; }
    50%      { transform: translateY(9px);   opacity: 1;    }
  }
  @keyframes pet-float-d {
    0%, 100% { transform: translateY(8px);   opacity: 0.8; }
    50%      { transform: translateY(-6px);  opacity: 1;   }
  }
</style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
